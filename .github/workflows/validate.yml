name: Validate and smoke test
on:
  push:
    branches: [main, 'refresh/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
  smoke:
    needs: static
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            kind_sha: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          - runner: ubuntu-24.04-arm
            arch: arm64
            kind_sha: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Install verified kind binary
        env:
          ARCH: ${{ matrix.arch }}
          KIND_SHA: ${{ matrix.kind_sha }}
        run: |
          curl -fsSL --retry 3 "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-$ARCH" -o kind
          echo "$KIND_SHA  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Create disposable cluster
        run: kind create cluster --wait 180s --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      - name: Validate API, startup, and persistent storage
        env:
          SMOKE_TEST_DISPOSABLE: 'yes'
        run: bash scripts/smoke.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          kubectl get nodes,pods,pvc -A -o wide > diagnostics/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          for app in uptime-kuma vaultwarden; do
            kubectl -n "$app" logs "deployment/$app" > "diagnostics/$app.log" 2>&1 || true
            kubectl -n "$app" describe pods > "diagnostics/$app-pods.txt" 2>&1 || true
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: diagnostics
          retention-days: 7
      - run: kind delete cluster
        if: always()
